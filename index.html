        el("h3", { className: "font-serif text-3xl leading-tight mb-1.5", style: { color: K } }, person.name),
        el(Meta, { items: [person.country, person.discover ? "Contemporary voice" : null] }),
        el("p", { className: "font-serif italic text-lg leading-snug mt-3 mb-2", style: { color: ink } }, person.hook),
        person.facts && person.facts.length
          ? el("p", { className: "text-[13px] leading-relaxed", style: { color: K, opacity: 0.6 } }, person.facts.join("   ·   "))
          : null,
        el(
          Disclosure,
          { label: "Why this belongs here", ink: ink },
          el("p", { className: "text-sm leading-relaxed mb-3", style: { color: K, opacity: 0.9 } }, person.why),
          el(LensPill, { lens: person.acdeg.lens, ink: ink }),
          el("p", { className: "text-[13px] leading-relaxed", style: { color: K, opacity: 0.75 } }, person.acdeg.text),
        ),
      ),
    ),
  );
}

    el(Annotation, { lens: book.tag, text: book.acdegText, ink: ink }),

function PoetrySection({ poem, ink }) {
  const isCopyright = poem.status === "copyright";
  const isFragment = !isCopyright && poem.fragment === true;
  const showExcerpt = isCopyright || isFragment;
  const statusLabel = isCopyright
    ? "Copyrighted — excerpt shown"
    : isFragment
      ? "Public domain — excerpt archived"
      : "Public domain — full text";
  const linkLabel = isCopyright || isFragment ? "Read the full poem" : "Read more";
  return el(
    "div",
    null,
    el("p", { className: "font-serif italic text-2xl leading-snug mb-1.5", style: { color: K } }, "“" + poem.title + "”"),
    el(Meta, { items: [poem.poet, poem.where] }),
    el(
      "div",
      { className: "mt-5 pl-5", style: { borderLeft: `2px solid ${ink}` } },
      el(
        "p",
        { className: "font-serif italic text-xl leading-relaxed", style: { color: K } },
        showExcerpt ? poem.excerpt : poem.text,
      ),
    ),
    el("p", { className: "text-[11px] uppercase tracking-[0.12em] mt-3", style: { color: J } }, statusLabel),
    el(Annotation, { lens: poem.tag, text: poem.acdegText, ink: ink }),
    el("div", { className: "mt-4" }, el(SearchLink, { href: googleSearchUrl(poem.title + " " + poem.poet + " full poem") }, linkLabel)),
  );
}

    el(Annotation, { lens: art.tag, text: art.acdegText, ink: ink }),
    art.source ? el("p", { className: "text-[10px] uppercase tracking-[0.08em] mt-3", style: { color: J, opacity: 0.55 } }, "Source — " + art.source) : null,
    el("div", { className: "mt-4" }, el(SearchLink, { href: googleSearchUrl(art.artist + " " + art.title) }, "Look it up")),

}

function ActSection({ act, roomLabel }) {

    "div",

      tag: "Democratic Culture",
      acdegText: "Uses cultural memory and historical identity to establish belonging across generations and geography.",
      status: "public",
      text: "I've known rivers: I've known rivers ancient as the world and older than the flow of human blood in human veins. My soul has grown deep like the rivers. I bathed in the Euphrates when dawns were young. I built my hut near the Congo and it lulled me to sleep. I looked upon the Nile and raised the pyramids above it. I heard the singing of the Mississippi when Abe Lincoln went down to New Orleans, and I've seen its muddy bosom turn all golden in the sunset. I've known rivers: Ancient, dusky rivers. My soul has grown deep like the rivers.",
